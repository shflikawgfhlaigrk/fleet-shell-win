name: linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webkit2gtk-4.1 and friends
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf file \
            xvfb webkit2gtk-driver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: JS tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build shell (deb + AppImage)
        run: npx tauri build

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.0.6

      - name: End-to-end under Xvfb (real binary, empty profile)
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run e2e

      - name: Upload e2e proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-shell-linux-e2e
          path: e2e/out/
          if-no-files-found: warn

      - name: Upload deb + AppImage
        uses: actions/upload-artifact@v4
        with:
          name: fleet-shell-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
