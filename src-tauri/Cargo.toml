[package]
name = "fleet-shell"
version = "0.1.0"
description = "BlackLabel fleet shell for Windows and Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
